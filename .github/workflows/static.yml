# Deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions required by GitHub Pages deployment.
# `actions: read` lets deploy-pages list the artifact of this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the
# in-progress and latest queued run. Do not cancel in-progress runs, so
# production deployments are allowed to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: check out the repo and upload the `github-pages` artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the whole repository (the site is static, no build step).
          path: "."

  # Deploy job: runs in a separate job so the artifact has time to be
  # finalized/indexed before deploy-pages looks it up. Running upload and
  # deploy back-to-back in one job intermittently fails with
  # "No artifacts named github-pages were found".
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
